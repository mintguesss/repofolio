# The author's own showcase (https://mintguesss.github.io/repofolio/), rebuilt every 3 hours with repofolio
# and deployed to this repo's GitHub Pages. It doubles as the live demo. Forks skip it.
#
# Also runs promotion: drafts appear in the encrypted admin page's 📣 tab; approving one there
# dispatches this workflow with the decision in the `posts` input, and the post goes out from here.
name: showcase

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; "⟳ Update now" in the admin page runs it on demand
  workflow_dispatch:
    inputs:
      posts:
        description: Post decisions from the admin page (JSON). Leave empty for a normal run.
        required: false
        default: ""
  push:
    branches: [main]
    paths: [".github/repofolio.config.yml", ".github/workflows/showcase.yml"]

permissions:
  contents: write   # the repofolio-data branch (post queue, competitor cache)
  pages: write
  id-token: write

# Never cancel a run halfway: it may be publishing posts.
concurrency:
  group: showcase
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mintguesss/repofolio'
    runs-on: ubuntu-latest
    outputs:
      site-dir: ${{ steps.repofolio.outputs.site-dir }}
    steps:
      - uses: actions/checkout@v5

      # This repo is public, so its logs are too: repofolio masks private repo names, the public
      # pages never include private repos, and the admin page + state branch are encrypted with the password.
      - id: repofolio
        uses: mintguesss/repofolio@v0.15.4
        with:
          token: ${{ secrets.REPOFOLIO_TOKEN || github.token }}
          config: .github/repofolio.config.yml
          posts: ${{ inputs.posts }}
        env:
          REPOFOLIO_ADMIN_PASSWORD: ${{ secrets.REPOFOLIO_ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Platforms: set the ones you use; the rest stay copy / share-link only.
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.repofolio.outputs.site-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
