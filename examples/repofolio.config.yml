# repofolio hub config — https://github.com/mintguesss/repofolio
owners: []              # GitHub users/orgs to scan; empty = the token's user
repos: []               # extra owner/name repos
exclude: []             # names or owner/name; trailing * wildcard ok
contributions:          # organisation / team repos you have commits in (team, research, course projects)
  enabled: false
  minCommits: 3          # fewer commits than this and a team repo is left out
  orgs: []              # organisations to look through too (needed with fine-grained tokens)
# personalSite:         # the admin page's 🌐 tab adds entries (and photos) to your personal website repo
#   repo: you/personal-site
#   branch: main
#   data: src/data/portfolio.ts      # arrays: projects, builds, awards, certifications, experience
#   details: src/data/buildsDetail.ts
#   publicDir: public
#   base: /personal-site             # basePath the site is served under
#   url: https://you.github.io/personal-site/
#   skip: []                         # repos already on the site under another name
# profile:              # the block in your profile README (profile-readme input)
#   sort: recent        # featured | recent (latest pushed, with the date)
#   limit: 5
#   title: "### 最近在做"
includeForks: false
includeArchived: true
includePrivate: true    # private repos go in CATALOG.md; never on the public site unless showcase: true
staleDays: 90
language: en            # en | zh-TW
urlCheck:
  enabled: true
llm:
  enabled: false        # summarise READMEs with Claude (needs ANTHROPIC_API_KEY secret)
site:
  title: ""             # defaults to your GitHub name
  tagline: ""           # defaults to your GitHub bio
  includePrivate: false
  links: []             # - { label: LinkedIn, url: https:// }
  hero:
    roles: []           # typing animation, e.g. [Full-stack developer, ML tinkerer]
  # sections: [hero, featured, projects, stats, status, timeline]
  customizer: true      # let visitors open the ⚙ panel
  theme:
    mode: simple        # simple (clean, light/dark follows the system) | tech (neon presets + effects)
    # scheme: auto      # simple mode: auto | light | dark
    # bgColor: "#fafafa" # custom page background; text colour adapts
    layout: grid        # grid | list
    # tech mode only:
    # preset: cyber     # cyber | midnight | matrix | synthwave | ocean | ember | aurora | mono | paper | daylight
    # background: particles  # particles | grid | matrix | aurora | stars | circuit | none
  # singlePage: false   # true = everything on one long page
issues:
  stale: true           # open an issue here for each stale project
# Commit the public site into another repo, e.g. your existing GitHub Pages site.
# publish:
#   repo: you/you.github.io
#   path: projects
# Post drafts you review and approve in the admin page (docs/PROMOTE.md).
# promote:
#   enabled: true
#   platforms: [linkedin, bluesky, threads, x, devto, hn, reddit]
#   hashtags: [buildinpublic]
# Competitor analysis per project, admin page only (on by default).
# competitors:
#   enabled: true
# Claude (optional, needs the ANTHROPIC_API_KEY secret). Usage and cost show in the admin page.
# llm:
#   model: claude-sonnet-5-5
#   features: { summaries: false, intros: true, drafts: true, competitors: true }
#   monthlyBudget: 5   # USD per month, 0 = no cap
