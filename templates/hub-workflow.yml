# repofolio — nightly scan of all your repos.
# Put this in a PRIVATE "hub" repo (e.g. you/projects). It commits CATALOG.md
# here and publishes the public showcase site to GitHub Pages.
#
# Setup:
#   1. Create a fine-grained PAT: Repository access = All repositories,
#      permissions (read-only): Contents, Metadata, Deployments, Pages.
#      Save it as the REPOFOLIO_TOKEN secret of this repo.
#   2. (optional) ANTHROPIC_API_KEY secret + llm.enabled: true for README summaries.
#   3. Settings → Pages → Source: GitHub Actions.
name: repofolio

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: repofolio
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: repofolio
        uses: mintguesss/repofolio@v0
        with:
          token: ${{ secrets.REPOFOLIO_TOKEN }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit catalog
        run: |
          cp out/CATALOG.md CATALOG.md
          git config user.name "repofolio[bot]"
          git config user.email "repofolio[bot]@users.noreply.github.com"
          git add CATALOG.md
          git diff --cached --quiet || git commit -m "chore: update project catalog"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.repofolio.outputs.site-dir }}

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
