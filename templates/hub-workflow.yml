# repofolio: nightly scan of all your repos.
# Put this in a "hub" repo (e.g. you/projects, private recommended).
# It commits CATALOG.md here and publishes the public showcase.
#
# Setup (details: https://github.com/mintguesss/repofolio/blob/main/docs/SETUP.md)
#   1. Secret REPOFOLIO_TOKEN: fine-grained PAT, Repository access = All repositories,
#      permissions (read-only): Contents, Metadata, Deployments, Pages.
#   2. Where should the site go? Pick one:
#      a) Into an existing public site repo (e.g. you/you.github.io):
#         add `publish:` to repofolio.config.yml and a secret REPOFOLIO_PUBLISH_TOKEN:
#         fine-grained PAT with access to ONLY that repo, Contents: Read and write.
#      b) GitHub Pages of this hub repo: Settings → Pages → Source: GitHub Actions,
#         then Settings → Variables → REPOFOLIO_PAGES = true.
#         (Pages on a private repo needs GitHub Pro.)
#   3. (optional) Secret ANTHROPIC_API_KEY + llm.enabled: true for README summaries.
#   4. (optional) promote.enabled: true for post drafts you approve in the admin page, plus the
#      platform secrets below (docs/PROMOTE.md). competitors.enabled is on by default.
name: repofolio

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      posts:
        description: Post decisions from the admin page (JSON). Leave empty for a normal run.
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# Never cancel a run halfway: it may be publishing posts.
concurrency:
  group: repofolio
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      site-dir: ${{ steps.repofolio.outputs.site-dir }}
    steps:
      - uses: actions/checkout@v5

      - id: repofolio
        uses: mintguesss/repofolio@v0
        with:
          token: ${{ secrets.REPOFOLIO_TOKEN }}
          publish-token: ${{ secrets.REPOFOLIO_PUBLISH_TOKEN }}
          posts: ${{ inputs.posts }}
        env:
          REPOFOLIO_ADMIN_PASSWORD: ${{ secrets.REPOFOLIO_ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Promotion (promote.enabled): set the platforms you use; the rest are copy / share links.
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit catalog
        run: |
          cp out/CATALOG.md CATALOG.md
          # Admin view (private): opened from <your site>/admin.html with a token that can read this repo.
          # Only keep this if the hub repo is PRIVATE.
          if [ -f out/admin.html ]; then cp out/admin.html admin.html; git add admin.html; fi
          git config user.name "repofolio[bot]"
          git config user.email "repofolio[bot]@users.noreply.github.com"
          git add CATALOG.md
          git diff --cached --quiet || git commit -m "chore: update project catalog"
          git push

      - if: vars.REPOFOLIO_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.repofolio.outputs.site-dir }}

  deploy:
    if: vars.REPOFOLIO_PAGES == 'true'
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
